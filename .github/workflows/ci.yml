name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  backend:
    name: Backend (lint + type-check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[runtime,dev]"

      - name: Ruff lint
        run: ruff check .
        continue-on-error: true   # tightened in a follow-up pass

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true

      - name: mypy
        run: mypy app
        continue-on-error: true   # strict mode + work-in-progress code

      # Importing the app validates Settings, so the suite needs a well-formed
      # key even though no test encrypts anything. Generated per run rather
      # than committed, so nothing in the repo looks like a usable secret.
      - name: Generate throwaway config for the test run
        run: |
          python - <<'EOF' >> "$GITHUB_ENV"
          import secrets
          from cryptography.fernet import Fernet
          print(f"NETFLEET_JWT_SECRET={secrets.token_urlsafe(48)}")
          print(f"NETFLEET_FERNET_KEY={Fernet.generate_key().decode()}")
          print("NETFLEET_DATABASE_URL=postgresql+asyncpg://ci:ci@localhost:5432/ci")
          EOF

      - name: pytest
        run: pytest -q
        # No longer allowed to fail. Two production bugs — a paramiko 4
        # attribute that no longer exists, and `vars()` on slots dataclasses
        # breaking three endpoints at once — shipped because nothing here
        # could catch them. The suite that would have is in tests/ now, so a
        # red run has to block.

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache disabled until pnpm-lock.yaml is committed (post-v0.1.0)

      - run: pnpm install --frozen-lockfile
        continue-on-error: true   # lockfile arrives on first dev install

      - run: pnpm install
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm typecheck
        continue-on-error: true
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: false
          tags: netfleet-api:ci

      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: false
          tags: netfleet-web:ci

      - name: Build updater image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./updater
          push: false
          tags: netfleet-updater:ci
