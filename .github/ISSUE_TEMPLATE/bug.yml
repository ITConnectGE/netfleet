name: Bug report
description: Report a problem with NetFleet
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please include enough context
        for us to reproduce it.
  - type: input
    id: version
    attributes:
      label: NetFleet version
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: vendor
    attributes:
      label: Affected vendor driver
      options: [MikroTik, FortiGate, Cisco, Ubiquiti, Other, N/A]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
