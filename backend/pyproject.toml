[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netfleet-api"
version = "0.18.0"
description = "NetFleet — multi-vendor network fleet management API"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ITConnect", email = "opensource@itconnect.ge" }]
dependencies = []

[project.optional-dependencies]
runtime = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis[hiredis]>=5.2",
    "httpx>=0.28",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43.0",
    "librouteros>=3.4",
    "paramiko>=3.5",
    "structlog>=24.4",
    "python-multipart>=0.0.20",
    "email-validator>=2.2",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-jose",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
